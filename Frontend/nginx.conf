# ---------------------------------------------------------------------------
# Criscom Group — ERP Frontend (SPA servido con nginx)
#
# Este nginx SOLO sirve el bundle estático de Vite. TLS y reverse proxy los
# resuelve Traefik afuera (docker-compose raíz). Por eso escucha en :80 plano.
#
# Diseño:
#   - SPA fallback: cualquier ruta que no sea un archivo → /index.html
#   - Cache agresivo para assets con hash (Vite los emite con [name].[hash].ext)
#   - Zero-cache para index.html → siempre refresca el shell de la app
#   - Headers de seguridad básicos
#   - gzip para texto
# ---------------------------------------------------------------------------

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Logs al stdout/stderr → docker logs los captura.
    access_log   /dev/stdout;
    error_log    /dev/stderr warn;

    # Compresión
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff2;

    # Headers de seguridad globales
    add_header X-Content-Type-Options   "nosniff"             always;
    add_header X-Frame-Options          "SAMEORIGIN"          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # Fotos y escaneo usan la cámara del mismo origen; los orígenes externos siguen bloqueados.
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(self)" always;

    # ---- Assets con hash: cache inmutable por un año ----
    # Vite emite /assets/*.[hash].{js,css,png,...} — seguro cachear para siempre.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Archivos con extensión conocida y hash: misma política.
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- index.html: nunca cachear ----
    # El bootstrap de la SPA debe ser siempre fresco para que recoja los nuevos
    # hashes de assets tras un deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma        "no-cache" always;
        expires -1;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Oculta archivos dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
