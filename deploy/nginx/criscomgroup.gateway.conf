upstream criscomgroup_backend {
    least_conn;
    server criscomgroup-backend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream criscomgroup_frontend {
    least_conn;
    server criscomgroup-frontend:80 max_fails=3 fail_timeout=30s;
}

upstream criscomgroup_ecommerce {
    least_conn;
    server criscomgroup-ecommerce:3000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name criscomgroup.com.pe www.criscomgroup.com.pe;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://criscomgroup.com.pe$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name www.criscomgroup.com.pe;
    ssl_certificate /etc/nginx/ssl/live/criscomgroup.com.pe/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/criscomgroup.com.pe/privkey.pem;
    return 301 https://criscomgroup.com.pe$request_uri;
}

server {
    listen 443 ssl http2;
    server_name criscomgroup.com.pe;

    ssl_certificate /etc/nginx/ssl/live/criscomgroup.com.pe/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/criscomgroup.com.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ERP administrativo en el mismo dominio.
    location = /erp { return 301 /erp/; }
    location /erp/ {
        proxy_pass http://criscomgroup_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API e imágenes compartidas por ERP y tienda.
    location /api/ {
        proxy_pass http://criscomgroup_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://criscomgroup_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1h;
    }

    # Tienda pública.
    location / {
        proxy_pass http://criscomgroup_ecommerce;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Compatibilidad con las URLs antiguas: todas convergen al dominio principal.
server {
    listen 80;
    server_name app.criscomgroup.com.pe api.criscomgroup.com.pe;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name app.criscomgroup.com.pe;
    ssl_certificate /etc/nginx/ssl/live/criscomgroup.com.pe/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/criscomgroup.com.pe/privkey.pem;
    return 301 https://criscomgroup.com.pe/erp$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.criscomgroup.com.pe;
    ssl_certificate /etc/nginx/ssl/live/criscomgroup.com.pe/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/criscomgroup.com.pe/privkey.pem;
    location /uploads/ { return 301 https://criscomgroup.com.pe/uploads/$is_args$args; }
    location / { return 301 https://criscomgroup.com.pe/api$request_uri; }
}
