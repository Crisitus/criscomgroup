user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting for TukiJuris
    limit_req_zone $binary_remote_addr zone=tukijuris_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=tukijuris_auth:10m rate=30r/s;

    # Upstream backends
    upstream backend_api {
        least_conn;
        server backend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend_app {
        least_conn;
        server frontend:80 max_fails=3 fail_timeout=30s;
    }

    upstream landing_app {
        least_conn;
        server landing:3000 max_fails=3 fail_timeout=30s;
    }

    upstream factura_app {
        least_conn;
        server factura-nginx:80 max_fails=3 fail_timeout=30s;
    }

    upstream tukifact_backend_api {
        least_conn;
        # Servicio retirado del host; se mantiene resolvible para permitir reloads seguros.
        server 127.0.0.1:65535 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    upstream tukifact_frontend_app {
        least_conn;
        # Servicio retirado del host; se mantiene resolvible para permitir reloads seguros.
        server 127.0.0.1:65535 max_fails=1 fail_timeout=5s;
    }

    upstream turismo_frontend_app {
        least_conn;
        server turismo-app:3000 max_fails=3 fail_timeout=30s;
    }

    # ============================================
    # LANDING PAGE - torolococayma.com / www.torolococayma.com
    # ============================================

    server {
        listen 80;
        server_name torolococayma.com www.torolococayma.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name torolococayma.com www.torolococayma.com;

        ssl_certificate /etc/nginx/ssl/live/torolococayma.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/torolococayma.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://landing_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

