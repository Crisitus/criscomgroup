    # ============================================
    # TUKIJURIS - tukijuris.net.pe / www.tukijuris.net.pe
    # ============================================

    upstream tukijuris_api {
        least_conn;
        server tukijuris-api:8000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream tukijuris_web {
        least_conn;
        server tukijuris-web:3000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name tukijuris.net.pe www.tukijuris.net.pe;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://tukijuris.net.pe$request_uri;
        }
    }

    # Redirect www -> non-www (HTTPS)
    server {
        listen 443 ssl http2;
        server_name www.tukijuris.net.pe;

        ssl_certificate /etc/nginx/ssl/live/tukijuris.net.pe/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/tukijuris.net.pe/privkey.pem;

        return 301 https://tukijuris.net.pe$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name tukijuris.net.pe;

        ssl_certificate /etc/nginx/ssl/live/tukijuris.net.pe/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/tukijuris.net.pe/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Auth - stricter rate limit
        location /api/auth/ {
            limit_req zone=tukijuris_auth burst=5 nodelay;
            proxy_pass http://tukijuris_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stripe webhook - no rate limit
        location /api/billing/webhook {
            proxy_pass http://tukijuris_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API - with SSE streaming support
        location /api/ {
            limit_req zone=tukijuris_api burst=20 nodelay;
            proxy_pass http://tukijuris_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_set_header Connection "";
        }

        # API docs
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://tukijuris_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://tukijuris_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend - Next.js
        location / {
            proxy_pass http://tukijuris_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ============================================
    # FV AUTO IMPORTS (external config)
    # ============================================
    include /etc/nginx/fvautoimports.conf;

    # ============================================
    # Default server - reject unknown hosts
    # ============================================
    server {
        listen 80 default_server;
        listen 443 ssl http2 default_server;
        server_name _;

        ssl_certificate /etc/nginx/ssl/live/torolococayma.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/torolococayma.com/privkey.pem;

        # Permite bootstrap ACME para dominios nuevos antes de crear su vhost.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 444;
        }
    }
}
