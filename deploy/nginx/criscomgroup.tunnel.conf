# Gateway nginx para Cloudflare Tunnel — CRISCOM Group
# Cloudflare termina TLS. Staging es revisable, pero nunca indexable.
map $host $robots_header {
    default "noindex, nofollow, noarchive";
    criscomgroup.com.pe "";
    www.criscomgroup.com.pe "";
}

# El gateway solo recibe tráfico desde Cloudflare Tunnel. Usamos el IP de
# cliente que Cloudflare entrega para que los límites no agrupen a todos los
# visitantes bajo la IP interna de cloudflared.
map $http_cf_connecting_ip $criscom_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone  $criscom_client_ip zone=criscom_api:10m  rate=20r/s;
limit_req_zone  $criscom_client_ip zone=criscom_auth:10m rate=5r/m;
limit_conn_zone $criscom_client_ip zone=criscom_conn:10m;

upstream criscomgroup_backend {
    least_conn;
    server criscomgroup-backend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
upstream criscomgroup_frontend {
    least_conn;
    server criscomgroup-frontend:80 max_fails=3 fail_timeout=30s;
}
upstream criscomgroup_ecommerce {
    least_conn;
    server criscomgroup-ecommerce:3000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80 default_server;
    server_name criscomgroup.com.pe www.criscomgroup.com.pe staging.criscomgroup.com.pe _;

    if ($host = www.criscomgroup.com.pe) { return 301 https://criscomgroup.com.pe$request_uri; }

    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn criscom_conn 40;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $robots_header always;

    location = /erp { return 301 /erp/; }
    location /erp/ {
        proxy_pass http://criscomgroup_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $criscom_client_ip;
        proxy_set_header X-Forwarded-For $criscom_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/auth/ {
        limit_req zone=criscom_auth burst=5 nodelay;
        proxy_pass http://criscomgroup_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $criscom_client_ip;
        proxy_set_header X-Forwarded-For $criscom_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    location /api/ {
        limit_req zone=criscom_api burst=40 nodelay;
        proxy_pass http://criscomgroup_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $criscom_client_ip;
        proxy_set_header X-Forwarded-For $criscom_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    location /uploads/ {
        proxy_pass http://criscomgroup_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $criscom_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_valid 200 1h;
    }
    location / {
        proxy_pass http://criscomgroup_ecommerce;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $criscom_client_ip;
        proxy_set_header X-Forwarded-For $criscom_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
