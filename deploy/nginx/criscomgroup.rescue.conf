# Acceso privado de continuidad: ERP + API, sin dependencia de Ecommerce.
# Se publica solo en loopback del Ryzen y Tailscale Serve lo expone al tailnet.
upstream rescue_backend {
    server criscomgroup-backend:3000 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

upstream rescue_frontend {
    server criscomgroup-frontend:80 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        access_log off;
        return 200 "erp-rescue-ok\n";
        add_header Content-Type text/plain;
    }

    location = / { return 302 /erp/; }
    location = /erp { return 301 /erp/; }

    location /erp/ {
        proxy_pass http://rescue_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://rescue_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        proxy_pass http://rescue_backend/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
