services:
  erp-rescue:
    image: nginx:1.27-alpine
    container_name: criscomgroup-erp-rescue
    restart: always
    volumes:
      - ./nginx/criscomgroup.rescue.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8181:80"
    networks:
      - shared-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q erp-rescue-ok"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m

networks:
  shared-gateway:
    external: true
    name: shared-gateway
