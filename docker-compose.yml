# ---------------------------------------------------------------------------
# Criscom Group — docker-compose PRODUCCIÓN (VPS).
#
# Arquitectura:
#
#       Internet ──:80/:443──┐
#                            ▼
#                         ┌──────────┐
#                         │ Traefik  │ ← Let's Encrypt automático
#                         └────┬─────┘
#                              │
#           ┌──────────────────┼────────────────────┐
#           ▼                  ▼                    ▼
#    criscomgroup.com.pe   app.criscomgroup.com.pe  api.criscomgroup.com.pe
#       (ecommerce)            (frontend)               (backend)
#                                                         │
#                                                         ▼
#                                                  ┌──────────┐
#                                                  │   MySQL  │ ← red interna,
#                                                  └──────────┘    NO expuesta
#
# Redes:
#   - web      → Traefik + todos los servicios web (backend/frontend/ecommerce)
#   - internal → Backend + DB (aislada, DB nunca es accesible desde internet)
#
# Uso:
#   cp .env.example .env        # edita valores reales
#   docker compose build
#   docker compose up -d
#
# DNS (Cloudflare, con "DNS only" / proxy gris mientras Let's Encrypt
# genera certificados; luego puedes activar proxy naranja si quieres CDN):
#   criscomgroup.com.pe        A   <IP_VPS>
#   app.criscomgroup.com.pe    A   <IP_VPS>
#   api.criscomgroup.com.pe    A   <IP_VPS>
# ---------------------------------------------------------------------------

services:

  # ======================================================================
  # Reverse proxy + TLS automático (Let's Encrypt HTTP-01 challenge)
  # ======================================================================
  traefik:
    image: traefik:v3.1
    container_name: criscomgroup_traefik
    restart: always
    command:
      # API dashboard (NO expuesto al público — solo para debug local)
      - --api.dashboard=false
      - --api.insecure=false

      # Providers
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=web

      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Redirect global HTTP → HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true

      # Let's Encrypt ACME HTTP-01
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Descomentar para pruebas (no rate-limitea):
      # - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory

      # Logs
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - criscomgroup_letsencrypt:/letsencrypt
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ======================================================================
  # Base de datos MySQL — AISLADA en red interna, sin puerto al host.
  # ======================================================================
  db:
    image: mysql:8.0
    container_name: criscomgroup_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-erp_computacion}
      MYSQL_USER: ${MYSQL_USER:-erpcomp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - erpcomp_mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ======================================================================
  # Backend API (Express) — api.criscomgroup.com.pe
  # ======================================================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: criscomgroup_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-erp_computacion}
      DB_USER: ${MYSQL_USER:-erpcomp}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DIALECT: mysql
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      RENIEC_API_KEY: ${RENIEC_API_KEY:-}
      FEATURE_ECOMMERCE: ${FEATURE_ECOMMERCE:-true}
      FEATURE_MARKETING: ${FEATURE_MARKETING:-false}
      FEATURE_LIBRO_RECLAMACIONES: ${FEATURE_LIBRO_RECLAMACIONES:-false}
      PUBLIC_BASE_URL: https://api.criscomgroup.com.pe
      FRONTEND_ORIGIN: https://criscomgroup.com.pe,https://app.criscomgroup.com.pe
    volumes:
      - erpcomp_backend_uploads:/app/src/uploads
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.backend.rule=Host(`api.criscomgroup.com.pe`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=3000

  # ======================================================================
  # ERP Frontend (React + Vite) — app.criscomgroup.com.pe
  # Las VITE_* se inlinean al BUILD → son build-args, no runtime env.
  # ======================================================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.criscomgroup.com.pe/api
        VITE_FACTURADOR_API_URL: ${VITE_FACTURADOR_API_URL:-https://api.criscomgroup.com.pe/api}
        VITE_FEATURE_ECOMMERCE: ${FEATURE_ECOMMERCE:-true}
        VITE_FEATURE_MARKETING: ${FEATURE_MARKETING:-false}
        VITE_FEATURE_LIBRO_RECLAMACIONES: ${FEATURE_LIBRO_RECLAMACIONES:-false}
    container_name: criscomgroup_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.frontend.rule=Host(`app.criscomgroup.com.pe`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=80

  # ======================================================================
  # Tienda pública (Next.js) — criscomgroup.com.pe
  # NEXT_PUBLIC_* también se inlinea → build-arg.
  # ======================================================================
  ecommerce:
    build:
      context: ./Ecommerce
      dockerfile: Dockerfile
      args:
        # Disponibles como ENV en build y runtime del container.
        NEXT_PUBLIC_API_URL: https://api.criscomgroup.com.pe
        NEXT_PUBLIC_SITE_URL: https://criscomgroup.com.pe
    container_name: criscomgroup_ecommerce
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.criscomgroup.com.pe
      NEXT_PUBLIC_SITE_URL: https://criscomgroup.com.pe
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Dominio apex + redirect www → apex (para evitar sites duplicados en SEO).
      - traefik.http.routers.ecommerce.rule=Host(`criscomgroup.com.pe`) || Host(`www.criscomgroup.com.pe`)
      - traefik.http.routers.ecommerce.entrypoints=websecure
      - traefik.http.routers.ecommerce.tls.certresolver=letsencrypt
      - traefik.http.services.ecommerce.loadbalancer.server.port=3000
      # Middleware: redirige www → apex (301 permanente)
      - traefik.http.middlewares.redirect-www.redirectregex.regex=^https?://www\.criscomgroup\.com\.pe/(.*)
      - traefik.http.middlewares.redirect-www.redirectregex.replacement=https://criscomgroup.com.pe/$${1}
      - traefik.http.middlewares.redirect-www.redirectregex.permanent=true
      - traefik.http.routers.ecommerce.middlewares=redirect-www@docker

volumes:
  erpcomp_mysql_data:
  erpcomp_backend_uploads:
  criscomgroup_letsencrypt:

networks:
  web:
    name: web
  internal:
    name: internal
    internal: true
